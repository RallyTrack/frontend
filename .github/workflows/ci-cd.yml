name: Frontend CI/CD

on:
  push:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  verify:
    name: Frontend verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  deploy:
    name: Deploy frontend and backend to Pi
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: verify
    runs-on: [self-hosted, rallytrack-pi]
    environment: production-pi
    timeout-minutes: 30
    steps:
      - name: Run guarded Pi deployment
        env:
          CONFIGURED_RALLYTRACK_ROOT: ${{ vars.RALLYTRACK_ROOT }}
        run: |
          deployment_root="${CONFIGURED_RALLYTRACK_ROOT:-/home/junmin/RallyTrack}"
          "$deployment_root/devops/pi/deploy.sh" frontend "$GITHUB_SHA"
