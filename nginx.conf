server {
    listen 80;
    server_name _;

    # 영상 업로드 최대 크기 (backend multipart 설정과 맞춤)
    client_max_body_size 2g;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: /dashboard, /video/123 등 새로고침 시에도 index.html 서빙
    location / {
        try_files $uri $uri/ /index.html;
    }

    # MinIO presigned URL (path-style: /<bucket>/<key>?X-Amz-...)
    # Host 헤더를 보존해야 presigned 서명이 일치한다.
    # 도메인(Cloudflare) 경유 시 이 경로 하나로 미디어까지 단일 origin에서 서빙된다.
    location /rallytrack-videos/ {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;           # 영상 스트리밍/Range 요청
        proxy_request_buffering off;   # AI 서버의 presigned PUT 업로드
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API는 backend 컨테이너로 프록시 (same-origin이라 CORS 불필요)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 대용량 업로드: 디스크 버퍼 없이 스트리밍, 분석 요청 대기 여유
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
